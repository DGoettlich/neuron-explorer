[project]
name = "neuron-explorer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "transformers",
    "safetensors",
    "numpy",
    "datasets",
    "accelerate",
    "fastapi>=0.133,<0.137",
    "uvicorn>=0.54.0",
    "sentence-transformers>=6.1.0",
    "umap-learn>=0.5.12",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neuron_compat*"]

[project.scripts]
neuron-serve-mps = "neuron_compat.serve:main"

[project.optional-dependencies]
mps = ["vllm", "vllm-metal", "psutil"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
vllm = { git = "https://github.com/DGoettlich/vllm-steering", branch = "mps-compatibility" }
vllm-metal = { url = "https://github.com/vllm-project/vllm-metal/releases/download/v0.32.0.dev20261027230727/vllm_metal-0.32.0.dev20261027230727-cp312-cp312-macosx_15_0_arm64.whl" }
